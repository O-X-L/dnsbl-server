---

# Domain to serve for
domain: 'dnsbl.example.org'
# Admin E-Mail Address (for response of SOA-type query)
admin_mail: 'admin@example.org'
# List of nameserver hosts (response of SOA- & NS-type queries)
nameservers:
  - 'ns1.example.org'
  - 'ns2.example.org'

domains:
  - response: 127.0.0.2
    content:
      - 'malicious.risk.oxl.app'

ips:
  - response: 127.0.0.2
    content:
      - '192.0.2.88'
      - 'fe80::9fe:dc1c:42f0:6e60'

nets:
  - response: 127.0.0.2
    content:
      - '192.0.2.128/29'
